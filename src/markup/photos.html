---
layout: page
title: Photos
---
<style>
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
  }
  .grid figure {
    margin: 0;
    position: relative;
  }
  .grid a {
    display: block;
    aspect-ratio: 1;
    overflow: hidden;
  }
  .grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .grid figcaption {
    position: absolute;
    inset: auto 0 0 0;
    padding: 8px;
    font-size: 0.75rem;
    color: #fff;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
    opacity: 0;
    transition: opacity 0.15s;
  }
  .grid figure:hover figcaption {
    opacity: 1;
  }
  .grid figcaption a {
    display: inline;
    color: #fff;
  }
</style>
<div class="grid">
  {% for photo in photos | sort(reverse=true, attribute='date') %}
  <figure>
    <a href="{{ relativePathPrefix }}static/images/{{ photo.file }}.webp">
      {% image 'static/images/' + photo.file + '.jpeg', size='thumb', alt=photo.alt or photo.description or '', sizes='33vw' %}
    </a>
    <figcaption>
      {% if photo.map %}<a href="{{ photo.map }}">📍 {{ photo.place }}</a> · {% elif photo.place %}📍 {{ photo.place }} · {% endif %}{{ photo.when or (photo.date | date("D MMMM YYYY")) }}{% if photo.camera %} · 📷 {{ photo.camera }}{% endif %}
    </figcaption>
  </figure>
  {% endfor %}
</div>
