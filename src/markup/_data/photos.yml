# Overrides only. Dropping an image in src/images puts it on the page with its EXIF date and
# GPS link; an entry here is how you correct or enrich that, key by key. No entry is fine.
#
# file: filename in src/images, extension included — this is the key, nothing matches without it
# date: the day it was taken, when EXIF holds the day it was scanned. Sorts the page, newest first
# when: display label, for when the exact day is a lie. 
# place: the name EXIF has no field for
# map: overrides the EXIF GPS link. 
# camera: the body that shot it, not the scanner EXIF names
# alt: falls back to description, then to a bare "Photograph, <place>, <date>" — write one
