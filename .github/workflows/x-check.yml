name: Check X credentials

# Manual only. Proves the four secrets and the OAuth signing against GET /2/users/me,
# which posts nothing — run it after minting or rotating keys, and when posts stop
# arriving and you need to know whether the token is the reason.
on:
  workflow_dispatch:

jobs:
  whoami:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Ask X who we are
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node script/post-to-x.mjs --whoami
