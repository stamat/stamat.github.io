name: Deploy GitHub Pages

on:
  push:
    branches:
      - master # Replace with your default branch if different

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v6

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24 # Specify your Node.js version
          cache: "npm"

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build the project
      - name: Build the project
        run: npm run build -- --base-url https://stamat.info

      # Upload the build output as an artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  # Runs after the deploy so a post never links at a page that is not live yet
  post-to-x:
    needs: build-and-deploy
    runs-on: ubuntu-latest

    steps:
      # Full history — the job compares this push against the commit before it
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Post newly published entries to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node script/post-to-x.mjs
